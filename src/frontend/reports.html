<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчёты | CRM Агентства</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Защита страницы: без токена редирект на вход -->
    <script>
        if (!localStorage.getItem('authToken')) {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>
    <!-- Шапка -->
    <header class="container mt-md mb-md flex" style="justify-content: space-between; align-items: center;">
        <a href="index.html" class="btn btn-secondary btn-sm">← На главную</a>
        <button id="logoutBtn" class="btn btn-secondary btn-sm">Выйти</button>
    </header>

    <main class="container">
        <h2 class="mb-md">Отчёты</h2>

        <!-- Навигация по отчётам -->
        <div class="flex mb-md" style="flex-wrap: wrap; gap: 0.5rem;">
            <button class="btn btn-sm tab-btn" data-target="active" onclick="switchTab('active', this)">Активные сделки</button>
            <button class="btn btn-sm tab-btn" data-target="completed" onclick="switchTab('completed', this)">Завершенные сделки</button>
            <button class="btn btn-sm tab-btn" data-target="payments" onclick="switchTab('payments', this)">Отчет по оплатам</button>
            <button class="btn btn-sm tab-btn" data-target="commissions" onclick="switchTab('commissions', this)">Отчет по комиссиям</button>
        </div>

        <!-- Активные сделки -->
        <section id="report-active" class="report-section card table-wrap">
            <h3 class="mb-md">Активные сделки</h3>
            <table><thead><tr><th>№</th><th>Объект</th><th>Этап</th><th>Дата создания</th><th>Менеджер</th></tr></thead>
            <tbody id="tbl-active"></tbody></table>
        </section>

        <!-- Завершенные сделки -->
        <section id="report-completed" class="report-section card table-wrap hidden">
            <h3 class="mb-md">Завершенные сделки</h3>
            <table><thead><tr><th>№</th><th>Объект</th><th>Сумма</th><th>Дата завершения</th></tr></thead>
            <tbody id="tbl-completed"></tbody></table>
        </section>

        <!-- Отчет по оплатам -->
        <section id="report-payments" class="report-section card table-wrap hidden">
            <h3 class="mb-md">Отчет по оплатам</h3>
            <table><thead><tr><th>Клиент</th><th>Сделка</th><th>Оплачено</th><th>Остаток</th></tr></thead>
            <tbody id="tbl-payments"></tbody></table>
        </section>

        <!-- Отчет по комиссиям -->
        <section id="report-commissions" class="report-section card table-wrap hidden">
            <h3 class="mb-md">Отчет по комиссиям агентства</h3>
            <table><thead><tr><th>Сделка</th><th>Сумма сделки</th><th>Тип комиссии</th><th>Сумма комиссии</th></tr></thead>
            <tbody id="tbl-commissions"></tbody></table>
        </section>
    </main>

    <script>
        // ===== ЗАГЛУШКИ ДАННЫХ =====
        const mockActive = [
            { id: 101, object: 'ул. Ленина, 10', stage: 'Переговоры', date: '2026-04-01', manager: 'Смирнов К.А.' },
            { id: 102, object: 'пр. Мира, 45', stage: 'Подготовка документов', date: '2026-03-28', manager: 'Иванова М.Д.' }
        ];

        const mockCompleted = [
            { id: 103, object: 'с. Лесное, 12', amount: '45 000 000 ₽', date: '2026-03-15' },
            { id: 104, object: 'ул. Гагарина, 7', amount: '9 200 000 ₽', date: '2026-02-20' }
        ];

        const mockPayments = [
            { client: 'Иванов И.И.', deal: '#101', paid: '4 000 000 ₽', remaining: '8 000 000 ₽' },
            { client: 'Сидоров П.В.', deal: '#102', paid: '15 000 000 ₽', remaining: '10 000 000 ₽' }
        ];

        const mockCommissions = [
            { deal: '#101', amount: '12 000 000 ₽', type: '5%', commission: '600 000 ₽' },
            { deal: '#102', amount: '25 000 000 ₽', type: '3%', commission: '750 000 ₽' },
            { deal: '#103', amount: '45 000 000 ₽', type: 'Фикс', commission: '1 000 000 ₽' }
        ];

        // ===== РЕНДЕР ТАБЛИЦ =====
        function renderTable(id, data, rowFn) {
            const tbody = document.getElementById(id);
            tbody.innerHTML = data.length ? data.map(rowFn).join('') : `<tr><td colspan="5" class="text-center text-muted">Нет данных</td></tr>`;
        }

        function initReports() {
            renderTable('tbl-active', mockActive, r => `<tr><td>#${r.id}</td><td>${r.object}</td><td>${r.stage}</td><td>${r.date}</td><td>${r.manager}</td></tr>`);
            renderTable('tbl-completed', mockCompleted, r => `<tr><td>#${r.id}</td><td>${r.object}</td><td>${r.amount}</td><td>${r.date}</td></tr>`);
            renderTable('tbl-payments', mockPayments, r => `<tr><td>${r.client}</td><td>${r.deal}</td><td>${r.paid}</td><td>${r.remaining}</td></tr>`);
            renderTable('tbl-commissions', mockCommissions, r => `<tr><td>${r.deal}</td><td>${r.amount}</td><td>${r.type}</td><td>${r.commission}</td></tr>`);
        }

        // ===== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК =====
        function switchTab(targetId, btn) {
            // Скрываем все секции
            document.querySelectorAll('.report-section').forEach(el => el.classList.add('hidden'));
            // Показываем нужную
            document.getElementById(`report-${targetId}`).classList.remove('hidden');
            
            // Обновляем активную кнопку
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('btn'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.add('btn-secondary'));
            btn.classList.remove('btn-secondary');
            btn.classList.add('btn');
        }

        // ===== ВЫХОД =====
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userRole');
            window.location.href = 'login.html';
        });

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        document.addEventListener('DOMContentLoaded', () => {
            // Активируем первую вкладку по умолчанию
            switchTab('active', document.querySelector('.tab-btn'));
            
            // TODO: Заменить на параллельные запросы к API
            // await Promise.all([
            //   fetch('/api/v1/reports/active-deals', { headers: { Authorization: `Bearer ${token}` } }).then(r=>r.json()),
            //   fetch('/api/v1/reports/completed-deals', ...),
            //   fetch('/api/v1/reports/payments/client', ...),
            //   fetch('/api/v1/reports/commissions', ...)
            // ]);
            initReports();
        });
    </script>
</body>
</html>
